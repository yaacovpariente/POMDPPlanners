# Existing hooks run only at pre-commit; the no-ai-credit hook opts into
# commit-msg, since the message does not exist yet when pre-commit runs.
default_stages: [pre-commit]
# A plain `pre-commit install` installs only the pre-commit hook unless told
# otherwise; this makes it install the commit-msg hook too.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: https://github.com/psf/black
    rev: 25.9.0
    hooks:
      - id: black
        language_version: python3.12
        args: [--line-length=100]

  - repo: local
    hooks:
      - id: no-ai-credit
        name: no AI tool credited in the commit
        entry: scripts/check_no_ai_credit.sh
        language: script
        stages: [commit-msg]
        always_run: true

      - id: pylint
        name: pylint
        entry: .venv/bin/python -m pylint
        language: system
        args: [--errors-only]
        files: ^POMDPPlanners/.*\.py$
        exclude: ^POMDPPlanners/tests/.*$
        pass_filenames: true

  - repo: https://github.com/RobertCraigie/pyright-python
    rev: v1.1.408
    hooks:
      - id: pyright
        files: ^docs/examples/.*\.ipynb$
        args: [docs/examples/]
        exclude: ^type_hints\.py$

      - id: pyright
        name: pyright (POMDPPlanners)
        files: ^POMDPPlanners/.*\.py$
