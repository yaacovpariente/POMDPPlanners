name: Auto-merge scoped develop PRs

on:
  pull_request_target:
    branches: [develop]
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Check changed paths
        id: paths
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          invalid="$(
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
              --jq '
                .[] |
                [.filename, (.previous_filename // empty)][] |
                select(. != "") |
                select((
                  startswith("POMDPPlanners/planners/") or
                  startswith("POMDPPlanners/environments/")
                ) | not)
              '
          )"

          if [ -n "$invalid" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Approve scoped PR
        if: steps.paths.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews" \
            -f event=APPROVE \
            -f body="Automatically approved: changes are limited to planners and environments."

      - name: Enable auto-merge
        if: steps.paths.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --auto \
            --squash
