name: Commit credit check

# Refuse to merge a commit that credits an AI coding tool. The commit-msg hook
# in .pre-commit-config.yaml catches this on a developer's machine, but only
# if the hooks are installed and not skipped with --no-verify. This runs the
# same script on every commit a pull request would bring in, so nothing lands
# on develop or master that way.
on:
  pull_request:
    branches: [ "master", "develop" ]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Check every commit on the pull request
      run: scripts/check_no_ai_credit.sh --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
